# EXAMPLE ONLY — do not put real secrets in git.
# Apply a real Secret out-of-band, e.g.:
#   kubectl -n mqtt-gateway create secret generic fastapi-mqtt-gateway \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=MQTT_USERNAME='' \
#     --from-literal=MQTT_PASSWORD=''
apiVersion: v1
kind: Secret
metadata:
  name: fastapi-mqtt-gateway
  labels:
    app: fastapi-mqtt-gateway
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-me-in-production-use-strong-secret"
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
