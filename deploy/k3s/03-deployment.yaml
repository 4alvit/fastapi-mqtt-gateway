apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-mqtt-gateway
  labels:
    app: fastapi-mqtt-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-mqtt-gateway
  template:
    metadata:
      labels:
        app: fastapi-mqtt-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: mp
      containers:
        - name: gateway
          image: ghcr.io/4alvit/fastapi-mqtt-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fastapi-mqtt-gateway
            - secretRef:
                name: fastapi-mqtt-gateway
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
