apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-mqtt-gateway
  labels:
    app: fastapi-mqtt-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-mqtt-gateway
  template:
    metadata:
      labels:
        app: fastapi-mqtt-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: mp
      containers:
        - name: gateway
          image: ghcr.io/4alvit/fastapi-mqtt-gateway:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fastapi-mqtt-gateway
            - secretRef:
                name: fastapi-mqtt-gateway
          # TTLs are ordinary configuration; retain the application's environment API.
          env:
            - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: fastapi-mqtt-gateway
                  key: ACCESS_TTL_MINUTES
            - name: JWT_REFRESH_TOKEN_EXPIRE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: fastapi-mqtt-gateway
                  key: REFRESH_TTL_DAYS
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
