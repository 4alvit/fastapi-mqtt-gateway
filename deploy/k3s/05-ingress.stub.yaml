# Optional Ingress stub for Traefik + cert-manager.
# Replace placeholder host before enabling TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-mqtt-gateway
  labels:
    app: fastapi-mqtt-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts:
  #       - mqtt-gateway.k3s.example.invalid
  #     secretName: mqtt-gateway-tls
  rules:
    - host: mqtt-gateway.k3s.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-mqtt-gateway
                port:
                  number: 8000
