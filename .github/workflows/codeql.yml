# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: CodeQL
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
      with:
        egress-policy: audit
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
      with:
        category: /language:${{matrix.language}}
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 0 * * 1
  workflow_call: {}
